name: GitHub Pages へデプロイ

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GitHub Pages を設定
        uses: actions/configure-pages@v5

      - name: 静的ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
